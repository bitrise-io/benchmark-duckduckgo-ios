# Benchmark DuckDuckGo-iOS on a Build Hub pool or a GitHub-hosted macOS runner.
# Mirrored from jayson-bitrise for BPS-734 (M5 Pro / M6 vs GitHub runners). Scripts: .github/bench/
name: Benchmark DuckDuckGo-iOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (Build Hub pool or GitHub-hosted)"
        type: choice
        default: "bitrise-m5pro-benchmark"
        options:
          - bitrise-m5pro-benchmark
          - bitrise-m6-benchmark
          - macos-15
          - macos-15-xlarge
      runs:
        description: "Measured runs"
        type: string
        default: "1"
      warmup_runs:
        description: "Warm-up runs (not counted)"
        type: string
        default: "0"
      suite:
        description: "build = clean/incremental/Release builds; test = build-for-testing + unit tests"
        type: choice
        default: "build"
        options:
          - build
          - test

permissions:
  contents: read

# One benchmark per runner label at a time in this repo (method: our builds never share a Mac).
concurrency:
  group: benchmark-${{ inputs.runner }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      METHOD_VERSION: gha-v1
      MACHINE_KEY: ${{ inputs.runner }}
      BENCHMARK_RUNS: ${{ inputs.runs }}
      WARMUP_RUNS: ${{ inputs.warmup_runs }}
      BENCHMARK_PROJECT: "DuckDuckGo-iOS"
      BENCH_REPO_URL: "https://github.com/duckduckgo/apple-browsers.git"
      BENCH_REF_NAME: "7.244.0+ios"
      BENCH_COMMIT: "560c4f78a44aa1af839e4fef654392ccd8c912fc"
      XCODE_PROJECT: "DuckDuckGo-iOS.xcodeproj"
      SCHEME: "iOS Browser"
      SIM_DEVICE_NAME: "iPhone 18 Pro"
      SIM_DESTINATION: "platform=iOS Simulator,name=iPhone 18 Pro,OS=latest"
      INCREMENTAL_TOUCH_FILE: "DuckDuckGo/Main/MainViewController.swift"
      SPM_FORCE_DEBUG: ${{ inputs.suite == 'test' && '1' || '' }}
      SKIP_TESTS: |
        SyncUI-iOSTests/TurnOffSyncSheetViewTests
        SyncUI-iOSTests/ScanQRCodeViewTests
        SyncUI-iOSTests/SimplifiedConnectingSheetViewTests
        SyncUI-iOSTests/SyncCodeSheetViewTests
        SyncUI-iOSTests/EnterCodeTabViewTests
        SyncUI-iOSTests/SimplifiedSyncSettingsViewTests
        UnitTests/AIChatSyncPromoViewTests
        UnitTests/SyncSuccessViewTests
        UnitTests/VoiceSearchFeedbackViewTests
        UnitTests/TabPreviewsSourceTests/testWhenUpdateFullScreenSnapshotThenItCanBeRetrieved
        UnitTests/NetworkProtectionVPNLocationViewModelTests/test_onViewAppeared_loadedListIsSorted
        UnitTests/AIChatContextualInputViewControllerTests/testWhenAskIsTappedWithTheDisclaimerOnScreenThenAButtonPromptIsReported
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stage benchmark scripts and paths
        run: |
          cp -R .github/bench "$RUNNER_TEMP/bench"
          echo "BENCH_OUT=$RUNNER_TEMP/bench-out" >> "$GITHUB_ENV"
          echo "DDG_SRC=$RUNNER_TEMP/ddg-src" >> "$GITHUB_ENV"
          echo "IOS_DIR=$RUNNER_TEMP/ddg-src/iOS" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/ddg-src/iOS/DerivedData" >> "$GITHUB_ENV"
      - name: Machine info
        run: source "$RUNNER_TEMP/bench/lib.sh" && sysinfo
      - name: Prepare (not timed)
        run: bash "$RUNNER_TEMP/bench/prepare.sh"
      - name: Benchmark
        run: bash "$RUNNER_TEMP/bench/${{ inputs.suite == 'test' && 'test.sh' || 'run.sh' }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.suite }}-${{ inputs.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-out
          if-no-files-found: warn
